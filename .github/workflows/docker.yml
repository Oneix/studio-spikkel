name: Docker demo

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - .dockerignore
      - docker/**
      - composer.*
      - config/**
      - src/**
      - templates/**
      - webroot/**
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start de demo
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Controleer de winkel en de volumes
        run: |
          catalog=$(curl -fsS http://127.0.0.1:8080/cadeaus)
          grep -Fq 'Notitieboekje met bloemenprint' <<< "$catalog"
          grep -Fq 'Digitale cadeaubon' <<< "$catalog"
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/beheer)" = 303
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/config/app_local.php)" = 404

          docker compose exec -T --user www-data web php -r '
              require "vendor/autoload.php";
              require "config/bootstrap.php";
              $db = Cake\Datasource\ConnectionManager::get("default");
              $db->execute("INSERT INTO contact_messages (name, email, message, created) VALUES (?, ?, ?, UTC_TIMESTAMP())", ["Docker test", "docker@example.test", "Test"]);
              file_put_contents("storage/uploads/.docker-check", "writable");
          '
          docker compose down
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T --user www-data web php -r '
              require "vendor/autoload.php";
              require "config/bootstrap.php";
              $db = Cake\Datasource\ConnectionManager::get("default");
              $saved = $db->execute("SELECT COUNT(*) FROM contact_messages WHERE email = ?", ["docker@example.test"])->fetchColumn();
              exit((int)$saved === 1 && file_get_contents("storage/uploads/.docker-check") === "writable" ? 0 : 1);
          '
      - name: Toon logs bij een fout
        if: failure()
        run: docker compose logs --no-color web
      - name: Ruim de testcontainers op
        if: always()
        run: docker compose down --volumes
